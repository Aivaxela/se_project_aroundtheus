<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Around the U.S." />
    <meta name="keywords" content="united states, usa, pictures" />
    <meta name="author" content="Riley Marcum" />
    <title>Around the U.S.</title>
    <link rel="favicon" href="./favicon.ico" />
  </head>
  <body class="page">
    <header class="header">
      <img class="header__logo" src="<%=require('./images/logo.svg')%>" alt="Around the US logo" />
    </header>
    <main>
      <section class="profile page__section">
        <img class="profile__image" alt="avatar image" />
        <div class="profile__image-edit">
          <img src="<%=require('./images/edit-profile.svg')%>" alt="profile image edit" />
        </div>
        <div class="profile__info">
          <div class="profile__text">
            <h1 class="profile__title"></h1>
            <button class="profile__edit-button" type="button" aria-label="edit button"></button>
          </div>
          <p class="profile__description"></p>
        </div>
        <button class="profile__add-button" type="button" aria-label="add button"></button>
      </section>
      <section class="cards page__section">
        <ul class="cards__list">
          <template id="card-template"
            ><li class="card">
              <img src="" alt="" class="card__image" />
              <button class="card__delete-button" type="button" aria-label="delete button"></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button class="card__like-button" type="button" aria-label="like button"></button>
              </div></li
          ></template>
        </ul>
      </section>
    </main>
    <footer class="footer page__section">© 2024 Around The U.S.</footer>

    <div class="modal" id="profile-modal">
      <div class="modal__container">
        <button class="modal__close"></button>
        <h2 class="modal__heading">Edit profile</h2>
        <form class="modal__form" id="profile-form">
          <input
            type="text"
            name="name"
            id="modal-name"
            class="modal__input profile-modal__name-input"
            placeholder="Name"
            minlength="2"
            maxlength="40"
            required
          />
          <span class="modal__input-error" id="modal-name-error"></span>
          <input
            type="text"
            name="desc"
            id="modal-desc"
            class="modal__input profile-modal__desc-input"
            placeholder="Description"
            minlength="2"
            maxlength="200"
            required
          />
          <span class="modal__input-error" id="modal-desc-error"></span>
          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="avatar-edit-modal">
      <div class="modal__container">
        <button class="modal__close"></button>
        <h2 class="modal__heading">Change profile picture</h2>
        <form class="modal__form" id="avatar-edit-form">
          <input
            type="url"
            name="Link"
            id="modal-avatar"
            class="modal__input"
            placeholder="Image link"
            required
          />
          <span class="modal__input-error" id="modal-avatar-error"></span>
          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="add-modal">
      <div class="modal__container">
        <button class="modal__close"></button>
        <h2 class="modal__heading">New place</h2>
        <form class="modal__form" id="add-form">
          <input
            type="text"
            name="Title"
            id="modal-title"
            class="modal__input"
            placeholder="Title"
            minlength="1"
            maxlength="30"
            required
          />
          <span class="modal__input-error" id="modal-title-error"></span>
          <input
            type="url"
            name="Link"
            id="modal-link"
            class="modal__input"
            placeholder="Image link"
            required
          />
          <span class="modal__input-error" id="modal-link-error"></span>
          <button class="modal__button modal__button_inactive" type="submit" disabled>
            Create
          </button>
        </form>
      </div>
    </div>

    <div class="modal image-modal" id="image-modal">
      <div class="image-modal__container">
        <button class="modal__close image-modal__close"></button>
        <img class="image-modal__image" src="" alt="image-enlarged" />
        <p class="image-modal__caption"></p>
      </div>
    </div>

    <div class="modal confirm-modal" id="confirm-modal">
      <div class="modal__container">
        <button class="modal__close"></button>
        <h2 class="modal__heading">Are you sure?</h2>
        <button class="modal__button" type="submit">Yes</button>
      </div>
    </div>
  </body>
</html>
